name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Buscar carpeta del proyecto
        id: proj
        run: |
          F=$(find . -name settings.gradle -not -path './.git/*' | head -n 1)
          echo "Encontrado: $F"
          echo "dir=$(dirname "$F")" >> "$GITHUB_OUTPUT"

      - name: Compilar
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle build --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: scorpysafio-mod
          path: ${{ steps.proj.outputs.dir }}/build/libs/*.jar
